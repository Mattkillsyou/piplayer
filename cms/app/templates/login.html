{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block body_class %}login{% endblock %}
{% block content %}
<div class="scene" aria-hidden="true">
  <div class="scene-scan"></div>
  <div class="scene-floor"></div>
  <div class="scene-skyline"><i></i><i></i><i></i></div>
  <div class="scene-vignette"></div>
</div>
<div class="auth-card">
  <div class="wordmark wordmark-lg">
    <span class="wordmark-eyebrow">Matt Brown's</span>
    <h1 class="wordmark-mark">PROJECTION<span class="wordmark-model">5000</span><span class="wordmark-cursor"></span></h1>
  </div>
  <hr>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">Connect</button>
  </form>
  <p class="foot">Sign in to manage your projector fleet.</p>
</div>
{% endblock %}

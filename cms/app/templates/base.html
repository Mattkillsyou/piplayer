<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user %}
  <header class="topbar">
    <div class="brand">
      <a href="/dashboard" aria-label="{{ app_name }} dashboard">
        <span class="brand-eyebrow">{{ app_eyebrow }}</span>
        <span class="wordmark">PROJECTION<span class="wordmark-key">5000</span></span>
      </a>
    </div>
    <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">&#8801;</button>
    <nav id="site-nav" aria-label="Console">
      <a href="/dashboard" {% if request.url.path == '/dashboard' %}class="active"{% endif %}>Dashboard</a>
      <a href="/library" {% if request.url.path.startswith('/library') %}class="active"{% endif %}>Library</a>
      <a href="/playlists" {% if request.url.path.startswith('/playlists') %}class="active"{% endif %}>Playlists</a>
      <a href="/devices" {% if request.url.path.startswith('/devices') %}class="active"{% endif %}>Devices</a>
      <a href="/groups" {% if request.url.path.startswith('/groups') %}class="active"{% endif %}>Groups</a>
      <a href="/audit" {% if request.url.path.startswith('/audit') %}class="active"{% endif %}>Audit</a>
      {% if user.role == 'admin' %}
      <a href="/users" {% if request.url.path.startswith('/users') %}class="active"{% endif %}>Users</a>
      <a href="/settings" {% if request.url.path.startswith('/settings') %}class="active"{% endif %}>Settings</a>
      {% endif %}
    </nav>
    <div class="user">
      <span class="username">{{ user.username }}</span>
      <span class="badge badge-{{ user.role }}">{{ user.role }}</span>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
  <script src="/static/app.js"></script>
</body>
</html>

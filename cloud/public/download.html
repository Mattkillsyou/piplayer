<!doctype html>
<!-- The home page: sign in / create an account (public, no login; served at / by src/pages/login.js). The SD flasher downloads sit behind sign-in on /flasher. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projection5000</title>
<style>
  @font-face { font-family: "Silkscreen"; font-style: normal; font-weight: 400; font-display: swap;
    src: url("/static/fonts/Silkscreen-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Silkscreen"; font-style: normal; font-weight: 700; font-display: swap;
    src: url("/static/fonts/Silkscreen-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 300 700; font-display: swap;
    src: url("/static/fonts/SpaceGrotesk-Variable.woff2") format("woff2"); }
  :root {
    --ground: #000000; --raised: #0D0D0D; --field: #0A0A0A; --phosphor: #FFFFFF; --ink: #E6E6E6; --body: #C9C9C9;
    --muted: #7A7A7A; --rule: #3A3A3A; --rule-strong: #727272;
    --display: "Silkscreen", "Press Start 2P", monospace;
    --sans: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--body); font-family: var(--sans); font-size: 17px; line-height: 1.55;
         padding: 40px 16px 64px; box-sizing: border-box; }
  .page { max-width: 880px; margin: 0 auto; }
  a { color: var(--phosphor); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 3px; }

  .masthead { display: flex; align-items: center; gap: 20px; margin-bottom: 32px; }
  .masthead svg { width: 64px; height: 64px; flex: none; }
  .eyebrow { font-family: var(--display); font-size: 15px; color: var(--ink); letter-spacing: 0.02em; }
  .wordmark { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--phosphor); line-height: 1.15; }
  @media (max-width: 720px) { .wordmark { font-size: 24px; } }
  @media (max-width: 480px) { .wordmark { font-size: 17px; } .masthead svg { width: 48px; height: 48px; } .masthead { gap: 14px; } }

  .btn { display: flex; align-items: center; justify-content: center; min-height: 64px; font-family: var(--sans);
         font-weight: 600; font-size: 18px; letter-spacing: 0.01em; line-height: 1.25; color: var(--ground);
         background: var(--phosphor); padding: 14px 20px; text-align: center; text-decoration: none;
         border: 1px solid var(--phosphor); white-space: nowrap; }
  @media (max-width: 480px) { .btn { font-size: 16px; } }
  .btn:hover { background: var(--ink); border-color: var(--ink); }
  .console { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  @media (max-width: 480px) { .console { grid-template-columns: 1fr; } }
  .btn.secondary { color: var(--phosphor); background: transparent; }
  .btn.secondary:hover { background: var(--raised); border-color: var(--phosphor); }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .foot { margin: 0; text-align: center; font-size: 15px; }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <svg viewBox="0 0 64 64" aria-hidden="true" role="img">
      <rect width="64" height="64" fill="#000"/>
      <rect x="34" y="10" width="24" height="26" fill="#fff"/>
      <rect x="36" y="12" width="20" height="22" fill="#e8e8e8"/>
      <polygon points="12,44 34,11 34,35" fill="rgba(255,255,255,0.45)"/>
      <line x1="12" y1="44" x2="34" y2="11" stroke="rgba(255,255,255,0.8)"/>
      <line x1="12" y1="44" x2="34" y2="35" stroke="rgba(255,255,255,0.8)"/>
      <rect x="4" y="40" width="10" height="8" fill="#fff"/>
      <rect x="13" y="42" width="2" height="4" fill="#fff"/>
      <path d="M1 8 V1 H8 M56 63 H63 V56" stroke="#fff" fill="none"/>
    </svg>
    <div>
      <div class="eyebrow">MATT BROWN'S</div>
      <div class="wordmark">PROJECTION5000</div>
    </div>
  </header>

  <p class="lead">Sign in to download the SD Flasher and manage your projectors.</p>
  <div class="console">
    <a class="btn" href="/login">Sign in</a>
    <a class="btn secondary" href="/signup">Create an account</a>
  </div>
  <p class="foot"><a href="/forgot">Forgot password</a></p>
</div>
</body>
</html>

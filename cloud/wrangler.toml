name = "piplayer-cloud"
main = "src/index.js"
compatibility_date = "2026-08-22"   # newest date the bundled workerd (vitest-pool-workers 0.22) accepts
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "projectors.photogen5000.com", custom_domain = true }
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "piplayer-cloud-db"
database_id = "dde0d711-5367-4acb-bb9e-4a85c87fb808"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "piplayer-cloud-media"

[vars]
PIPLAYER_SCREENSHOT_INTERVAL = "60"
PIPLAYER_MAX_UPLOAD_BYTES = "5368709120"
PIPLAYER_MAX_SCREENSHOT_BYTES = "5242880"
PIPLAYER_DEFAULT_IMAGE_DURATION = "10"
PIPLAYER_AUDIT_RETENTION_DAYS = "365"
# Optional: PIPLAYER_PUBLIC_BASE_URL = "https://cms.example.com" fixes the CMS_URL printed in the
# Devices install snippet (default: the origin the browser is using).

# Alerts (src/alerts.js): outbound email through Email Routing on photogen5000.com. Sender
# alerts@photogen5000.com; every destination address must be verified in the Cloudflare
# dashboard (Email > Email Routing > Destination addresses). The code tolerates the binding
# being absent (wrangler dev / tests): the email channel then reports "not configured".
[[send_email]]
name = "ALERT_MAIL"

# Finishing an upload hashes the stored object (src/uploads.js uploadComplete) up to
# PIPLAYER_VERIFY_SHA_MAX_BYTES (default 8 MiB: what fits the Workers Free CPU budget). On the
# Workers Paid plan add a [limits] block with cpu_ms = 300000 (Free refuses it) and raise the
# var so multi-GB videos are verified too.

[triggers]
crons = ["0 3 * * *", "*/5 * * * *"]   # daily housekeeping; alerts.evaluate every 5 min (index.js scheduled)

# Secrets (wrangler secret put): SESSION_SECRET, SETUP_TOKEN. Optional, for the automatic camera
# tunnels (src/cloudflare.js): CF_API_TOKEN (Account > Cloudflare Tunnel: Edit, Zone > DNS: Edit,
# Account > Access: Apps and Policies: Edit), CF_ACCOUNT_ID, CF_ZONE_ID (photogen5000.com; the
# CF_ZONE_NAME var overrides the zone name). Without all three the feature reports "not configured".
# Local dev gets throwaway values from the `dev` script via --var.

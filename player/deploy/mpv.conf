# PiPlayer mpv configuration -- kiosk mode for projector loop playback.
# Located at ~/.config/mpv/mpv.conf for the projector user.
# Negated options are written option=no (a "no-" prefix must not carry a value).

fullscreen=yes
input-default-bindings=no
osc=no
osd-bar=no
cursor-autohide=always
input-cursor=no
keep-open=no
loop-playlist=inf
idle=yes
quiet=yes

# Hardware decoding: auto-safe only picks decoders mpv considers safe (on
# Trixie/mpv 0.40 that is drm (zero-copy) or drm-copy for HEVC on the Pi 5;
# the mpv journal line "Using hardware decoding (...)" shows which). To force
# a specific decoder after testing on your hardware, e.g. Pi 4 H.264:
#   hwdec=v4l2m2m-copy
hwdec=auto-safe

# Direct rendering on the KMS/DRM display without X11/Wayland. vo=gpu with the
# drm context uses the GPU for scaling/conversion and can attach hardware
# decoders; it needs /dev/dri access (projector-mpv.service grants it).
vo=gpu
gpu-context=drm
# Fallback: the software-only KMS output. Use it if vo=gpu fails to initialise
# (journalctl -u projector-mpv shows "Failed to initialize a video output" or
# EGL/GBM errors, e.g. an old firmware or a missing libegl). It cannot use
# hardware decoding and scales every frame on the CPU.
# vo=drm
# Inside a desktop session, drop gpu-context=drm and keep vo=gpu.

# Default image display time -- the player daemon overrides this per-item
# based on the playlist configuration in the CMS.
image-display-duration=10

# Audio: leave default (mpv picks ALSA/PulseAudio). Set explicitly if needed:
# ao=alsa
# audio-device=alsa/default

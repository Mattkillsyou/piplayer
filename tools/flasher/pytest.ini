[pytest]
# sys-level capture only: pytest's default fd capture dup2()s fd 1/2 per test, which on Windows
# closes the HANDLE Tcl cached for its stdout/stderr channels. The freed HANDLE value is later
# reused by CreateFile(init.tcl) and Tcl's open-channel lookup then refuses it ("couldn't read
# file init.tcl"), so one random tk.Tk() per run failed and its GUI test skipped.
addopts = --capture=sys
